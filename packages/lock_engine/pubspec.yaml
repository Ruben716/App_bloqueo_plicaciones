name: lock_engine
description: "Motor nativo de bloqueo de apps de Sigilo (Android). Expone una API tipada generada con Pigeon."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.ruben716.lock_engine
        pluginClass: LockEnginePlugin
