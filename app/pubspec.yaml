name: sigilo
description: "Sigilo: bloquea tus apps con un PIN propio, independiente del bloqueo del teléfono."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  design_system:
    path: ../packages/design_system
  lock_engine:
    path: ../packages/lock_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
